    Projects:
      - name: Variational Quantum Classifiers
        summary: Quantum Computing Group, IIT Roorkee. PennyLane variational quantum classifiers benchmarked against classical baselines.
        url: https://github.com/para-bellum-hub/qml_classifier
        start_date: 2025-12
        end_date: 2026-01
        highlights:
          - Data re-uploading ansatz with circular CNOT entanglement, class-weighted loss, early stopping on validation AUC, stratified splits and train-only scaling.
          - Benchmarked against logistic regression and random forest on credit-card fraud and breast-cancer data.

      - name: Hydrogen Orbital Solver
        summary: Advised by Prof. Abhiraj Sharma, Civil Engineering, IIT Roorkee.
        url: https://github.com/para-bellum-hub/hydrogen_orbital_simulator
        start_date: 2024-12
        end_date: 2025-02
        highlights:
          - Solved hydrogen-atom wavefunctions from the Schrödinger equation with Legendre, associated Legendre and Laguerre recursions implemented from scratch.
          - 3D orbital visualizations across quantum numbers (n, l, m).

