    Experience:
      - company: Trust Lab, IIT Bombay
        position: Research Intern, advised by Prof. Pratik Jawanpuria (C-MInDS)
        start_date: 2026-05
        end_date: 2026-07
        summary: Context compression and adaptation in prior-data fitted networks (TabPFN).
        highlights:
          - Built a transformer attention-analysis pipeline that extracts TabPFN's internal attention distributions to rank training samples by informativeness for compressed inference.
          - Fine-tuned LoRA adapters on a frozen TabPFN across synthetic priors from four data-generating families; cross-prior transfer degraded as the Wasserstein/MMD distance between priors grew.
          - Related prior geometry to adapter geometry with adapter-similarity metrics, tested this under cross-family ablations, and caught and corrected an undertraining artifact that inflated the effect.

      - company: Department of Electrical Engineering, IIT Roorkee
        position: Undergraduate Researcher, advised by Prof. Parikshit Pareek
        location: Roorkee, India
        start_date: 2026-02
        end_date: 2026-04
        summary: Gaussian-process surrogates for EV-charging feasibility on power grids.
        highlights:
          - Replaced repeated AC power-flow solves with GPU-accelerated Gaussian-process surrogates (BoTorch, CUDA) for rapid EV-charging feasibility screening.
          - Generated AC power-flow datasets in Julia across loading conditions; surrogates reached about 1e-5 p.u. voltage error and 1e-4 rad angle error.
          - Used GP predictive uncertainty (squared-exponential kernel) for voltage-constraint screening, delivered through an interactive feasibility-analysis tool.

